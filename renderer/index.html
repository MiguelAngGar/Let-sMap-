<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let'sMap!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Header (shared) ───────────────────────────────────────────────────── -->
  <header id="titlebar">
    <span class="app-name">Let'sMap!</span>
    <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Open settings">
      <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z"/>
      </svg>
    </button>
  </header>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- VIEW 1 — Drop zone                                                     -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <div id="view-drop" class="view active">
    <div id="drop-zone" role="region" aria-label="Song drop zone">
      <div class="drop-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M24 4v28M14 22l10 10 10-10" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 36v4a2 2 0 002 2h28a2 2 0 002-2v-4"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="drop-headline">Drag your song here</p>
      <p class="drop-hint">mp3 &nbsp;·&nbsp; wav &nbsp;·&nbsp; flac &nbsp;·&nbsp; ogg &nbsp;·&nbsp; m4a</p>
    </div>
    <p id="status-bar" aria-live="polite"></p>
  </div>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- VIEW 2 — BPM Validation                                                -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <div id="view-bpm" class="view">

    <!-- ── 1. Waveform timeline ─────────────────────────────────────────── -->
    <div class="timeline-wrapper">
      <canvas id="waveform-canvas" aria-label="Song waveform — click or drag to seek"></canvas>
    </div>

    <!-- ── 2. Playback row ──────────────────────────────────────────────── -->
    <div class="playback-row">
      <button id="play-btn" class="play-btn" aria-label="Play">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M6.3 2.84A1.5 1.5 0 004 4.11v11.78a1.5 1.5 0 002.3 1.27l9.344-5.891a1.5 1.5 0 000-2.538L6.3 2.84z"/>
        </svg>
        Play
      </button>

      <span id="time-display" class="time-display" aria-live="off">0:00 / 0:00</span>

      <div class="beat-area">
        <div id="beat-dot" aria-hidden="true"></div>
        <span class="kb-hint">Space</span>
      </div>
    </div>

    <!-- ── 3. BPM display + custom input ─────────────────────────────────── -->
    <div class="bpm-hero">
      <div class="bpm-number-row">
        <span id="bpm-value" class="bpm-number">—</span>
        <span class="bpm-unit">BPM</span>
      </div>

      <div class="custom-bpm-wrap">
        <input
          type="number"
          id="custom-bpm-input"
          class="custom-bpm-input"
          min="60" max="320" step="0.5"
          placeholder="Custom…"
          aria-label="Enter custom BPM (60–320), press Enter to apply"
          autocomplete="off"
          spellcheck="false"
        >
        <span class="custom-bpm-hint">↵</span>
      </div>
    </div>

    <!-- ── 4. Candidates ─────────────────────────────────────────────────── -->
    <section class="bpm-section">
      <h3 class="section-label">Candidates</h3>
      <div id="candidates-list" class="candidates-list" role="listbox" aria-label="BPM candidates"></div>
    </section>

    <!-- ── 5. Modifiers ──────────────────────────────────────────────────── -->
    <section class="bpm-section">
      <h3 class="section-label">Modifiers</h3>
      <div class="modifiers-row">
        <button id="halfbeat-btn" class="toggle-btn" aria-pressed="false">
          Shift Grid&nbsp;+½&thinsp;Beat
        </button>
        <button id="double-btn" class="toggle-btn" aria-pressed="false">
          Double BPM
        </button>
      </div>
    </section>

    <!-- ── 6. Status + actions ───────────────────────────────────────────── -->
    <p id="bpm-status" class="bpm-status" aria-live="polite"></p>

    <div class="bpm-actions">
      <button id="bpm-cancel-btn" class="secondary-btn">Cancel</button>
      <button id="create-map-btn" class="primary-btn">Create Map →</button>
    </div>

  </div>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- Settings modal                                                          -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="settings-modal">

      <div class="modal-header">
        <h2 id="modal-title">Settings</h2>
        <button id="modal-close" class="icon-btn" aria-label="Close settings">
          <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"/>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="field">
          <label for="export-dir">Export folder</label>
          <div class="folder-row">
            <input type="text" id="export-dir" readonly placeholder="~/Documents/BeatSaberMaps">
            <button id="browse-btn" class="secondary-btn">Browse…</button>
          </div>
          <p class="field-hint">Beat Saber project folders are saved here.</p>
        </div>
        <div class="field">
          <label for="mapper-name">Mapper name</label>
          <input type="text" id="mapper-name" placeholder="YourName" maxlength="64"
            autocomplete="off" spellcheck="false">
          <p class="field-hint">Written into Info.dat as the level author.</p>
        </div>
      </div>

      <div class="modal-footer">
        <button id="cancel-btn" class="secondary-btn">Cancel</button>
        <button id="save-btn" class="primary-btn">Save</button>
      </div>

    </div>
  </div>

  <!-- Load order matters: engine → timeline → bpm-view → app -->
  <script src="audio-engine.js"></script>
  <script src="timeline.js"></script>
  <script src="bpm-view.js"></script>
  <script src="app.js"></script>
</body>
</html>
